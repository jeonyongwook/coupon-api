plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

// Spring Boot 3.4.3이 관리하는 Testcontainers(1.20.x)는 Docker Engine 29 이상(최소 API 1.44)과 통신하지 못해
// 테스트가 건너뛰어지므로 1.21.4로 올린다.
ext['testcontainers.version'] = '1.21.4'

group = 'com.couponapi'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API 문서 자동 생성: 실행 후 http://localhost:8087/swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 운영 DB는 MariaDB, 테스트는 인메모리 H2(MariaDB 호환 모드)로 실행
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 실제 MariaDB 컨테이너로 SKIP LOCKED 동시 선점을 검증하는 테스트용 (Docker 필요, 없으면 해당 테스트만 건너뜀)
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb'
}

tasks.named('test') {
    // 성능 측정 테스트는 시간이 오래 걸리고 결과가 환경에 좌우되므로 기본 test/CI에서는 제외한다.
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// 주문 접수(대량 INSERT) 성능 측정 전용 태스크. Docker 필요: ./gradlew benchmark
tasks.register('benchmark', Test) {
    description = '주문 접수 대량 INSERT 성능을 MariaDB 컨테이너에서 측정한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    testLogging {
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}