# 테스트 전용 설정: 인메모리 H2(MariaDB 호환 모드). 운영 설정(application.properties in main)은 로드되지 않는다.
spring.datasource.url=jdbc:h2:mem:coupon-test;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 배치/스케줄러/시드는 끄고, 테스트 코드가 직접 호출해서 결정적으로 검증한다.
app.scheduling.enabled=false
app.seed.enabled=false

# 가상 발행처 지연을 거의 없애 테스트를 빠르게 한다. (지연·타임아웃 시나리오는 테스트가 직접 만든 가짜 발행처로 검증)
app.issuer.mock.min-latency-ms=0
app.issuer.mock.max-latency-ms=30
