server.port=8087

# DB 접속 정보는 기본값 없이 환경변수로만 받는다. (설정하지 않으면 기동 시 실패한다.)
# 로컬 실행은 application-local.properties(local 프로파일)가 기본값을 제공한다.
# rewriteBatchedStatements=true : MariaDB/MySQL JDBC 드라이버가 배치 insert를 실제 네트워크 단에서도
# 하나의 묶음 쿼리로 보내도록 하는 옵션 (없으면 hibernate.jdbc.batch_size를 켜도 개별 전송됨).
# 예) DB_URL=jdbc:mariadb://db-host:3306/coupon-api?useUnicode=true&characterEncoding=utf-8&rewriteBatchedStatements=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 기본은 스키마를 검증만 한다. 테이블 자동 생성(update)은 local 프로파일에서만 쓴다.
# 운영 스키마는 Flyway/Liquibase 같은 마이그레이션 도구로 관리해야 한다. (아직 미구현)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 뷰 렌더링이 없는 API 서버이므로 요청 전체에 걸쳐 DB 커넥션을 쥐고 있는 OSIV를 끈다.
spring.jpa.open-in-view=false

# OrderDetail 대량 insert 성능을 위한 JDBC 배치 설정.
# IDENTITY 채번 전략은 Hibernate의 insert 배치를 무력화하므로, OrderDetail의 PK는
# SEQUENCE 채번(allocationSize=50)으로 변경해 아래 배치 설정이 실제로 적용되도록 했다.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 데모용 시드 데이터(데모 고객사/쿠폰 상품/배치 설정). 알려진 데모 키가 운영에 생기지 않도록 기본은 꺼 둔다.
# local 프로파일에서만 켜진다.
app.seed.enabled=${SEED_ENABLED:false}
# 발행 배치(스케줄러) 사용 여부. 테스트에서는 false.
app.scheduling.enabled=true

# 가상 발행처(MockIssuerClient)의 응답 지연 범위(ms). 실제 발행처 어댑터를 붙이면 그쪽이 우선한다.
app.issuer.mock.min-latency-ms=200
app.issuer.mock.max-latency-ms=2000
