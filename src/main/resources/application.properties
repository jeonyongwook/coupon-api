server.port=8087

# 운영 환경에서는 DB_URL/DB_USERNAME/DB_PASSWORD 환경변수로 주입할 것.
# rewriteBatchedStatements=true : MariaDB/MySQL JDBC 드라이버가 배치 insert를 실제 네트워크 단에서도
# 하나의 묶음 쿼리로 보내도록 하는 옵션 (없으면 hibernate.jdbc.batch_size를 켜도 개별 전송됨)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/coupon-api?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:system}

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# 주의: update는 로컬 개발 편의용. 운영 배포 시에는 DDL_AUTO=validate(또는 none)로 두고
# Flyway/Liquibase 같은 마이그레이션 도구로 스키마를 관리할 것.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 뷰 렌더링이 없는 API 서버이므로 요청 전체에 걸쳐 DB 커넥션을 쥐고 있는 OSIV를 끈다.
spring.jpa.open-in-view=false

# OrderDetail 대량 insert 성능을 위한 JDBC 배치 설정.
# IDENTITY 채번 전략은 Hibernate의 insert 배치를 무력화하므로, OrderDetail의 PK는
# SEQUENCE 채번(allocationSize=50)으로 변경해 아래 배치 설정이 실제로 적용되도록 했다.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 로컬 데모용 시드 데이터(데모 고객사/쿠폰 상품/배치 설정) 자동 생성. 운영에서는 SEED_ENABLED=false.
app.seed.enabled=${SEED_ENABLED:true}
# 발행 배치(스케줄러) 사용 여부. 테스트에서는 false.
app.scheduling.enabled=true
